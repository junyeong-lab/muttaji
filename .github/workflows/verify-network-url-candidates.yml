name: Verify replacement network vacancies in live browser
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-network-url-candidates.mjs'
      - '.github/workflows/verify-network-url-candidates.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/verify-network-url-candidates.mjs
