name: Real production browser 50-posting E2E
on:
  push:
    branches: [main]
    paths:
      - 'scripts/browser-real-50-e2e.mjs'
      - 'tests/fixtures/real-postings-smoke.json'
      - '.github/workflows/browser-real-postings.yml'
  workflow_dispatch:
jobs:
  actual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reviewed dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Drive deployed page with 50 public job posting texts
        run: node scripts/browser-real-50-e2e.mjs
        env:
          MUTTAJI_E2E_BASE_URL: https://project-muttaji.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-real-postings-50
          path: |
            real-posting-browser-report.json
            browser-failure.png
          retention-days: 7
