name: Actual 50 posting source and category semantic audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/semantic-audit-real-50.mjs'
      - '.github/workflows/semantic-audit-real-50.yml'
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/semantic-audit-real-50.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-audit-50-source-and-classifications
          path: |
            real-50-semantic-source.json
            real-50-semantic-index.json
          retention-days: 7
