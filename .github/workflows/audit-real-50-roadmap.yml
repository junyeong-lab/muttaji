name: Actual 50 posting roadmap content audit
on:
  push:
    branches: [main]
    paths: ['scripts/audit-real-50-roadmap.mjs', '.github/workflows/audit-real-50-roadmap.yml', 'assets/job-text-analyzer.js', 'assets/roadmap.js', 'assets/requirement-comparison.js', 'assets/experience-explanations.js']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: semantic-audit-50-source-and-classifications
          run-id: 40723619518
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - run: node scripts/audit-real-50-roadmap.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-50-roadmap-contents
          path: real-50-roadmap-audit.json
          retention-days: 7
