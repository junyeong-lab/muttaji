name: Diagnose real posting section boundaries
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-real-postings.mjs'
      - '.github/workflows/diagnose-real-postings.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/diagnose-real-postings.mjs
